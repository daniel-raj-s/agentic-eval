name: AI Agent Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_redteam:
        description: "Run the adversarial Promptfoo red-team scan"
        type: boolean
        default: false
      run_llm_evals:
        description: "Run DeepEval LLM-judge metrics (requires a provider key)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_PYTHON: "python"
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"
  FORCE_COLOR: "1"

jobs:
  quality-gate:
    name: Evaluate agent quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_LLM_KEY: ${{ (secrets.GEMINI_API_KEY != '' || secrets.GROQ_API_KEY != '' || secrets.OPENAI_API_KEY != '') && '1' || '0' }}
      ALLOW_MISSING_JUDGE: ${{ ((secrets.GEMINI_API_KEY == '' && secrets.GROQ_API_KEY == '' && secrets.OPENAI_API_KEY == '') || (github.event_name == 'workflow_dispatch' && !inputs.run_llm_evals)) && '1' || '0' }}
      RUN_REDTEAM: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_redteam) && '1' || '0' }}
      RUN_LLM_EVALS: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_llm_evals) && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Promptfoo
        run: npm ci

      - name: Prepare results directory
        run: mkdir -p results

      # Deterministic tests must pass outright. They also emit the
      # ToolSelectionAccuracy metric consumed by the quality gate.
      - name: Run deterministic test suite
        run: pytest tests --ignore=tests/deepeval -m "not llm" -q

      - name: Run DeepEval LLM metrics
        if: env.RUN_LLM_EVALS == '1' && env.HAS_LLM_KEY == '1'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_PROVIDER: ${{ vars.EVAL_JUDGE_PROVIDER || 'gemini' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gemini-3.8-flash' }}
          EVAL_JUDGE_FALLBACKS: ${{ vars.EVAL_JUDGE_FALLBACKS || 'gemini-flash-lite-latest,gemini-3.6-flash,gemini-4-hydrogen' }}
          EVAL_JUDGE_TIMEOUT: "30"
          EVAL_JUDGE_COOLDOWN_SECONDS: "30"
          EVAL_JUDGE_MIN_INTERVAL_SECONDS: "2"
          EVAL_JUDGE_RETRY_DELAY_SECONDS: "6"
          EVAL_JUDGE_RETRY_BUDGET_SECONDS: "120"
          EVAL_KEEP_METRICS: "1"
        run: pytest tests/deepeval -m llm -q

      # Continue on failure so the gate still receives the JSON artifact and
      # can block the merge with a readable report.
      - name: Run Promptfoo assertion and security suite
        id: promptfoo
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODE: deterministic
        run: npx --no-install promptfoo eval -c tests/promptfoo/promptfooconfig.yaml -o results/promptfoo-results.json --no-cache

      - name: Run Promptfoo red-team scan
        if: env.RUN_REDTEAM == '1' && env.HAS_LLM_KEY == '1'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: "1"
        # `redteam run -o` writes generated probes, not evaluation results. The
        # gate needs a Promptfoo eval JSON artifact, so generate then evaluate.
        run: |
          npx --no-install promptfoo redteam generate -c tests/promptfoo/redteam.yaml -o tests/promptfoo/redteam-generated.yaml --no-cache
          node scripts/inject_redteam_grader.js tests/promptfoo/redteam-generated.yaml
          npx --no-install promptfoo eval -c tests/promptfoo/redteam-generated.yaml -o results/promptfoo-redteam-results.json -j 1 --delay 10000 --no-cache

      - name: Enforce quality gate thresholds
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gemini-3.8-flash' }}
          QUALITY_GATE_ALLOW_MISSING_JUDGE: ${{ env.ALLOW_MISSING_JUDGE }}
          QUALITY_GATE_REQUIRE_REDTEAM: ${{ env.RUN_REDTEAM }}
        run: python scripts/quality_gate.py

      - name: Comment quality report on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const reportPath = 'results/quality_gate_report.md';
            if (!fs.existsSync(reportPath)) {
              core.warning('No quality gate report was generated.');
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');
            const marker = 'AI Quality Gate:';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f results/quality_gate_report.md ]; then
            cat results/quality_gate_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-evaluation-results
          path: |
            results/
            .deepeval/
          if-no-files-found: warn
          retention-days: 14
